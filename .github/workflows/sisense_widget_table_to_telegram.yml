name: Test SB Calls Widgets

on:
  workflow_dispatch:

concurrency:
  group: sb-calls-owner-widgets
  cancel-in-progress: true

jobs:
  send_widgets:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: Validate Python syntax
        run: |
          python -m py_compile sisense_widget_to_telegram.py

      - name: Validate required secrets
        env:
          SISENSE_USER: ${{ secrets.SISENSE_USER }}
          SISENSE_PASS: ${{ secrets.SISENSE_PASS }}
          SBCALLSM_BOT_TOKEN: ${{ secrets.SBCALLSM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$SISENSE_USER" || {
            echo "ERROR: SISENSE_USER is missing"
            exit 1
          }

          test -n "$SISENSE_PASS" || {
            echo "ERROR: SISENSE_PASS is missing"
            exit 1
          }

          test -n "$SBCALLSM_BOT_TOKEN" || {
            echo "ERROR: SBCALLSM_BOT_TOKEN is missing"
            exit 1
          }

          test -n "$TELEGRAM_CHAT_ID" || {
            echo "ERROR: TELEGRAM_CHAT_ID is missing"
            exit 1
          }

          echo "All required secrets are available."

      - name: Send non-empty Owner SD widgets
        env:
          SISENSE_USER: ${{ secrets.SISENSE_USER }}
          SISENSE_PASS: ${{ secrets.SISENSE_PASS }}
          SBCALLSM_BOT_TOKEN: ${{ secrets.SBCALLSM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python sisense_widget_to_telegram.py
